gateway:
  host: 0.0.0.0
  port: 8080

routing:
  # network thresholds that trigger degraded routes
  small_latency_ms: 600      # above this -> prefer small cloud model
  small_loss: 0.05
  local_latency_ms: 2500     # above this -> prefer local model even while online
  local_loss: 0.25
  provider_failure_threshold: 3
  provider_cooldown_s: 30
  request_timeout_s: 25
  max_tokens_default: 512
  local_max_tokens: 1200     # cap on the on-device rung
  degraded_max_tokens: 300   # response cap on degraded cloud rungs — this,
                             # not the model swap, is what cuts wire bytes
  model_probe_interval_s: 300  # real one-token completion per cloud model;
                               # catches retired models that path probes miss
                               # (disable with OKADA_MODEL_PROBE=0)

cache:
  ttl_s: 900
  max_entries: 512

queue:
  retention_s: 86400         # completed/failed results are deleted after this
  max_attempts: 50           # then the item is marked failed, not retried forever
  # encryption at rest: set OKADA_QUEUE_KEY (64 hex chars, or any passphrase)

models:
  # used when the matching API key is present in the environment.
  # Model IDs rot: Groq retired two families in Aug–Sep 2026 with ~30 days'
  # notice. Run `scripts/check_models.py` after any provider announcement; the
  # gateway also probes each model with a real completion every
  # model_probe_interval_s and routes around any that answer "not found".
  openai:
    large: gpt-4o
    small: gpt-4o-mini
  anthropic:
    large: claude-sonnet-5-5
    small: claude-haiku-5-5
  groq:
    large: openai/gpt-oss-120b     # free tier ~1,000 req/day (verify on console.groq.com)
    small: openai/gpt-oss-20b
  gemini:
    large: gemini-2.5-flash
    small: gemini-2.5-flash-lite   # free tier; 3.5 Flash-Lite exists — confirm the ID via check_models
  openrouter:
    large: openrouter/auto
    small: openai/gpt-oss-20b
  local:
    model: qwen2.5:0.5b                    # ollama fallback backend only
    llamacpp_url: http://127.0.0.1:8081    # canonical backend: llama-server (GGUF).
                                           # llama-server's own default moved to 9931 in
                                           # v0.7.0; the gateway also tries 9931 and 8080.
  mock:
    large: mock-large
    small: mock-small
    alt: mock-alt

network:
  simulator_enabled: true
  default_profile: excellent
