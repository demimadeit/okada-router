# Okada Router — full stack in one command:
#
#   GROQ_API_KEY=gsk_... docker compose up
#
# Then point any OpenAI client at http://localhost:8080/v1
# and open http://localhost:8080 for the demo app.
#
# The local model downloads once (~1GB) into a named volume, after which
# the 'local' route works with no internet at all.
#
# The llama.cpp image is PINNED to a build tag. `latest`/`server` floats, and
# llama.cpp v0.7.0 (Oct 2026) changed llama-server defaults (port 8080 -> 9931,
# output format, slot/session files). Bump the tag on purpose, test, commit.

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b11870
    command: >
      -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8081 -c 4096
    volumes:
      - okada-models:/root/.cache/llama.cpp
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      OKADA_LLAMACPP_URL: http://llama:8081
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OKADA_API_KEY: ${OKADA_API_KEY:-}
      OKADA_KEYS_FILE: ${OKADA_KEYS_FILE:-}
      OKADA_QUEUE_KEY: ${OKADA_QUEUE_KEY:-}
      OKADA_FREE_TIER_PROVIDERS: ${OKADA_FREE_TIER_PROVIDERS:-groq,gemini,openrouter}
      OKADA_ADMIN_TOKEN: ${OKADA_ADMIN_TOKEN:-}       # unlocks /console/api/admin and network control
      OKADA_SIGNUP: ${OKADA_SIGNUP:-1}                # 0 = invite-only (create accounts via admin)
    volumes:
      - okada-logs:/app/logs        # queue/accounts sqlite + telemetry survive restarts
    depends_on:
      - llama
    restart: unless-stopped

volumes:
  okada-models:
  okada-logs:
