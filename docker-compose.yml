# Okada Router — full stack in one command:
#
#   GROQ_API_KEY=gsk_... docker compose up
#
# Then point any OpenAI client at http://localhost:8080/v1
# and open http://localhost:8080 for the demo app.
#
# The local model downloads once (~1GB) into a named volume, after which
# the 'local' route works with no internet at all.

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8081 -c 4096
    volumes:
      - okada-models:/root/.cache/llama.cpp
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      OKADA_LLAMACPP_URL: http://llama:8081
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OKADA_API_KEY: ${OKADA_API_KEY:-}
    depends_on:
      - llama
    restart: unless-stopped

volumes:
  okada-models:
