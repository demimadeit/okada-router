<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okada Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F6F7F6; --panel:#FFFFFF; --ink:#171D1B; --ink-soft:#5A6663; --ink-muted:#8A9490;
    --line:#E0E5E3; --accent:#C2620A; --accent-soft:#F5E4D2;
    --ok:#178A50; --warn:#C2620A; --down:#C03A2B; --chip:#EDF0EF;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    /* route series: validated categorical slots, fixed order = ladder order */
    --s-cloud-large:#2a78d6; --s-cloud-small:#eb6834; --s-alternate:#1baf7a;
    --s-local:#eda100; --s-cache:#e87ba4; --s-queue:#008300; --s-direct:#6250d6;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1413; --panel:#171D1B; --ink:#E9EDEB; --ink-soft:#93A09C; --ink-muted:#6B7774;
      --line:#242C2A; --accent:#EE8A2F; --accent-soft:#33230F;
      --ok:#3BB877; --warn:#EE8A2F; --down:#E06153; --chip:#1D2523;
      --shadow:0 1px 3px rgba(0,0,0,.4);
      --s-cloud-large:#3987e5; --s-cloud-small:#d95926; --s-alternate:#199e70;
      --s-local:#c98500; --s-cache:#d55181; --s-queue:#008300; --s-direct:#9085e9;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1413; --panel:#171D1B; --ink:#E9EDEB; --ink-soft:#93A09C; --ink-muted:#6B7774;
    --line:#242C2A; --accent:#EE8A2F; --accent-soft:#33230F;
    --ok:#3BB877; --warn:#EE8A2F; --down:#E06153; --chip:#1D2523;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --s-cloud-large:#3987e5; --s-cloud-small:#d95926; --s-alternate:#199e70;
    --s-local:#c98500; --s-cache:#d55181; --s-queue:#008300; --s-direct:#9085e9;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100;font-size:15px;line-height:1.45}
  .mono{font-family:"IBM Plex Mono",monospace}
  a{color:var(--accent)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  label{display:block;font-size:.8rem;color:var(--ink-soft);margin:.6rem 0 .25rem}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:.5rem .9rem;font-weight:600;font-size:.88rem}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--down)}
  .btn.sm{padding:.3rem .6rem;font-size:.78rem}
  .hidden{display:none !important}

  /* auth */
  #auth{min-height:100%;display:grid;place-items:center;padding:1rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow)}
  #auth .card{width:min(420px,100%)}
  .logo{font-variation-settings:"wdth" 120;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
  .logo em{font-style:normal;color:var(--accent)}
  .logo small{font-weight:600;color:var(--ink-soft);font-size:.8rem;margin-left:.4rem;font-variation-settings:"wdth" 100}
  .tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:0 0 1rem;flex-wrap:wrap}
  .tabs button{border:none;background:none;color:var(--ink-soft);padding:.55rem .8rem;border-bottom:2px solid transparent;font-weight:600;font-size:.88rem}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .err{color:var(--down);font-size:.82rem;min-height:1.2em;margin-top:.5rem}

  /* shell */
  #shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;min-height:100%}
  header{grid-column:1/-1;display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:.45rem;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-soft);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:.3rem .7rem;white-space:nowrap}
  .led{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .led.warn{background:var(--warn)} .led.down{background:var(--down)}
  nav{border-right:1px solid var(--line);padding:1rem .8rem;background:var(--panel)}
  nav h4{margin:.2rem .4rem .5rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
  nav .t{display:block;width:100%;text-align:left;border:none;background:none;color:var(--ink);padding:.5rem .6rem;border-radius:10px;font-size:.9rem}
  nav .t.active{background:var(--accent-soft);color:var(--ink);font-weight:700}
  nav .t small{display:block;color:var(--ink-soft);font-size:.72rem;font-weight:400}
  main{padding:1.2rem 1.4rem 3rem;min-width:0}
  .titlebar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;min-width:0}
  .titlebar h1{margin:0;font-size:1.35rem;font-variation-settings:"wdth" 110;letter-spacing:-.01em}
  .titlebar .tabs{margin:0;border:none}
  .grid{display:grid;gap:.9rem}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .95rem}
  .tile .l{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
  .tile .n{font-size:1.55rem;font-weight:800;font-variation-settings:"wdth" 110;letter-spacing:-.02em;margin-top:.15rem;font-variant-numeric:tabular-nums}
  .tile .s{font-size:.74rem;color:var(--ink-soft)}
  .charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .95rem .5rem;position:relative}
  .chart h3{margin:0 0 .3rem;font-size:.85rem;font-weight:700}
  .chart .sub{font-size:.72rem;color:var(--ink-soft);margin-bottom:.4rem}
  .chart svg{max-width:100%;height:170px;display:block;overflow:visible}
  .chart .empty{height:170px;display:grid;place-items:center;color:var(--ink-muted);font-size:.82rem}
  .legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.72rem;color:var(--ink-soft);margin:.4rem 0 .2rem}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.72rem;padding:.35rem .55rem;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:4;font-family:"IBM Plex Mono",monospace}
  .axis{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--ink-muted)}
  .gridline{stroke:var(--line);stroke-width:1}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;font-size:.7rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
  td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .rc{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:.7rem;background:var(--chip);border-radius:999px;padding:.15rem .5rem}
  .rc i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto}
  .tbl h3{margin:0;padding:.8rem .95rem .3rem;font-size:.85rem}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .keyonce{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:.8rem .95rem;margin:.8rem 0}
  .keyonce code{display:block;font-family:"IBM Plex Mono",monospace;font-size:.85rem;word-break:break-all;margin:.4rem 0}
  pre{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;overflow:auto;font-family:"IBM Plex Mono",monospace;font-size:.78rem;line-height:1.5;margin:.4rem 0 1rem}
  .muted{color:var(--ink-soft);font-size:.85rem}
  /* playground */
  .pg{display:grid;grid-template-rows:1fr auto;height:calc(100vh - 190px);min-height:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .msgs{overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
  .m{max-width:85%;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .m.me{align-self:flex-end;background:var(--ink);color:var(--paper);padding:.6rem .9rem;border-radius:16px;border-bottom-right-radius:5px}
  .m.bot{align-self:flex-start;padding:.1rem .15rem}
  .composer{display:flex;gap:.5rem;padding:.7rem;border-top:1px solid var(--line)}
  .composer textarea{resize:none;height:44px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:1rem}
  .modal .card{width:min(460px,100%)}
  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem .9rem;border-radius:999px;font-size:.82rem;z-index:30;display:none}
  @media (max-width:760px){
    #shell{grid-template-columns:1fr}
    header{flex-wrap:wrap;gap:.5rem}
    #gwpill{display:none}
    .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
    nav{border-right:none;border-bottom:1px solid var(--line);display:flex;gap:.3rem;overflow-x:auto;padding:.5rem .8rem}
    nav h4{display:none} nav .t{white-space:nowrap;width:auto} nav .t small{display:none}
    main{padding:1rem}
    .pg{height:calc(100vh - 240px)}
  }
</style>
</head>
<body>

<section id="auth">
  <div class="card">
    <div class="logo">okada<em>.</em><small>cloud</small></div>
    <p class="muted" style="margin:.6rem 0 1rem">AI that answers on networks you can't trust. Create a tenant, get a key, point any OpenAI SDK at this gateway.</p>
    <div class="tabs"><button id="tab-login" class="active">Sign in</button><button id="tab-signup">Create account</button></div>
    <form id="form-login">
      <label>Email</label><input name="email" type="email" required autocomplete="email">
      <label>Password</label><input name="password" type="password" required autocomplete="current-password">
      <div class="err" id="err-login"></div>
      <button class="btn primary" style="width:100%;margin-top:.6rem">Sign in</button>
    </form>
    <form id="form-signup" class="hidden">
      <label>Name of your app or company</label><input name="name" required placeholder="e.g. Lagos Pharmacy POS">
      <label>Email</label><input name="email" type="email" required autocomplete="email">
      <label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">
      <div class="err" id="err-signup"></div>
      <button class="btn primary" style="width:100%;margin-top:.6rem">Create account &amp; first key</button>
    </form>
  </div>
</section>

<section id="shell" class="hidden">
  <header>
    <div class="logo">okada<em>.</em><small>cloud</small></div>
    <span class="pill" id="netpill"><span class="led" id="netled"></span><span id="nettext">…</span></span>
    <span class="pill" id="gwpill" title="gateway providers">…</span>
    <div class="spacer"></div>
    <span class="muted" id="who"></span>
    <button class="btn sm" id="logout">Sign out</button>
  </header>
  <nav>
    <h4>Tenants</h4>
    <div id="tenantlist"></div>
    <button class="t" id="newtenant" style="color:var(--accent);font-weight:600">+ New tenant</button>
  </nav>
  <main id="main"></main>
</section>

<div id="tip" class="tip"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') n.className=v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k==='html') n.innerHTML=v; else n.setAttribute(k,v);} for (const c of kids.flat()) if (c!=null) n.append(c.nodeType?c:document.createTextNode(c)); return n; };
const ROUTES = ['cloud-large','cloud-small','alternate','local','cache','queue','direct-cloud'];
const RLABEL = {'cloud-large':'cloud · large','cloud-small':'cloud · small (capped)','alternate':'alternate provider','local':'on-device','cache':'cache','queue':'queued','direct-cloud':'direct (no resilience)'};
const RCOLOR = r => `var(--s-${r==='direct-cloud'?'direct':r})`;
const fmtUSD = v => v >= 1 ? '$'+v.toFixed(2) : '$'+v.toFixed(4);
const fmtT = t => new Date(t*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtHM = t => new Date(t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
let TOKEN = localStorage.getItem('okada_console_token') || '';
let ME = null, CFG = {}, CUR = null, TAB = 'overview', RANGE = 24;
const toast = m => { const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 2600); };

async function api(path, opts={}) {
  const h = Object.assign({'content-type':'application/json'}, opts.headers||{});
  if (TOKEN) h.authorization = 'Bearer ' + TOKEN;
  const r = await fetch('/console/api' + path, Object.assign({}, opts, {headers:h, body: opts.body!=null && typeof opts.body!=='string' ? JSON.stringify(opts.body) : opts.body}));
  if (r.status === 401 && path !== '/login' && path !== '/signup') { signOut(); throw new Error('signed out'); }
  const data = r.headers.get('content-type')?.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data?.error?.message || data?.error || r.statusText);
  return data;
}

/* ---------- auth ---------- */
$('#tab-login').onclick = () => { $('#tab-login').classList.add('active'); $('#tab-signup').classList.remove('active'); $('#form-login').classList.remove('hidden'); $('#form-signup').classList.add('hidden'); };
$('#tab-signup').onclick = () => { $('#tab-signup').classList.add('active'); $('#tab-login').classList.remove('active'); $('#form-signup').classList.remove('hidden'); $('#form-login').classList.add('hidden'); };
$('#form-login').onsubmit = async e => { e.preventDefault(); const f=new FormData(e.target); try { const d = await api('/login', {method:'POST', body:{email:f.get('email'), password:f.get('password')}}); TOKEN=d.token; localStorage.setItem('okada_console_token', TOKEN); await boot(); } catch (err) { $('#err-login').textContent = err.message; } };
$('#form-signup').onsubmit = async e => { e.preventDefault(); const f=new FormData(e.target); try { const d = await api('/signup', {method:'POST', body:{name:f.get('name'), email:f.get('email'), password:f.get('password')}}); TOKEN=d.token; localStorage.setItem('okada_console_token', TOKEN); sessionStorage.setItem('okada_first_key', JSON.stringify({tenant:d.first_tenant, key:d.first_key})); await boot(); } catch (err) { $('#err-signup').textContent = err.message; } };
function signOut(){ api('/logout', {method:'POST'}).catch(()=>{}); TOKEN=''; localStorage.removeItem('okada_console_token'); ME=null; $('#shell').classList.add('hidden'); $('#auth').classList.remove('hidden'); }
$('#logout').onclick = signOut;

/* ---------- boot / shell ---------- */
async function boot(){
  CFG = await api('/config').catch(()=>({}));
  if (!CFG.signup_enabled) $('#tab-signup').classList.add('hidden');
  if (!TOKEN) return;
  try { ME = await api('/me'); } catch { return; }
  $('#auth').classList.add('hidden'); $('#shell').classList.remove('hidden');
  $('#who').textContent = ME.account.email;
  const first = sessionStorage.getItem('okada_first_key');
  if (first) { const f = JSON.parse(first); sessionStorage.removeItem('okada_first_key'); CUR = f.tenant; TAB='keys'; renderShell(); showKeyOnce(f.key, 'default'); }
  else { if (!CUR || !ME.tenants.find(t=>t.id===CUR)) CUR = ME.tenants[0]?.id || null; renderShell(); }
  pollNetwork();
}
function renderShell(){
  const list = $('#tenantlist'); list.innerHTML='';
  for (const t of ME.tenants) list.append(el('button', {class:'t'+(t.id===CUR?' active':''), onclick:()=>{CUR=t.id; renderShell();}}, t.name, el('small', {}, `${t.requests_24h} req · 24h`)));
  updateGwPill();
  renderMain();
}
function updateGwPill(){
  const g = ME.gateway; const r = g.routes;
  const parts = ['cloud-large','alternate','local'].filter(k=>r[k]).map(k => `${k.replace('cloud-large','cloud')}: ${r[k].provider}${r[k].model_ok?'':' ✕'}${k==='local'&&!r[k].available?' (off)':''}`);
  $('#gwpill').textContent = (g.mock_mode ? 'mock providers · ' : '') + parts.join(' · ');
}
async function pollNetwork(){
  try { const n = await api('/network'); const s = n.state; const led=$('#netled');
    led.className = 'led ' + (!s.online ? 'down' : (s.latency_ms >= 600 || s.packet_loss >= 0.05) ? 'warn' : '');
    $('#nettext').textContent = s.online ? `${s.profile} · ${s.latency_ms}ms · ${Math.round(s.packet_loss*100)}% loss` : `${s.profile} · offline`;
    window._net = n; if (TAB==='overview' && $('#netchart')) drawNetwork($('#netchart'), n.history);
  } catch {}
  if (ME) setTimeout(pollNetwork, 5000);
}
$('#newtenant').onclick = () => modal(el('div', {}, el('h3',{style:'margin:0 0 .4rem'},'New tenant'), el('p',{class:'muted'},'A tenant is one app or customer. It has its own keys, budget, cache namespace and routing flags.'),
  el('label',{},'Name'), el('input',{id:'nt-name',placeholder:'e.g. support-bot-prod'}),
  el('label',{},'Daily budget, USD (blank = none)'), el('input',{id:'nt-budget',type:'number',step:'0.01',min:'0'}),
  el('div',{class:'row',style:'margin-top:.8rem'}, el('label',{style:'margin:0;display:flex;gap:.4rem;align-items:center'}, el('input',{id:'nt-nooff',type:'checkbox',style:'width:auto'}), 'No-offshore (cache / on-device / queue only — prompts never leave this gateway)')),
  el('div',{class:'row',style:'justify-content:flex-end;margin-top:1rem'}, el('button',{class:'btn',onclick:closeModal},'Cancel'), el('button',{class:'btn primary',onclick:async()=>{ try{ const b=$('#nt-budget').value; const t=await api('/tenants',{method:'POST',body:{name:$('#nt-name').value, max_budget_usd:b?parseFloat(b):null, budget_duration:'daily', no_offshore:$('#nt-nooff').checked}}); closeModal(); ME=await api('/me'); CUR=t.id; TAB='keys'; renderShell(); }catch(e){toast(e.message);} }},'Create'))));
function modal(content){ closeModal(); const m = el('div',{class:'modal',id:'modal',onclick:e=>{if(e.target.id==='modal')closeModal();}}, el('div',{class:'card'}, content)); document.body.append(m); }
function closeModal(){ $('#modal')?.remove(); }
function showKeyOnce(key, name){ modal(el('div',{}, el('h3',{style:'margin:0 0 .4rem'},'Your API key'), el('p',{class:'muted'},`This is the only time "${name}" is shown. Okada stores a hash, not the key.`), el('div',{class:'keyonce'}, el('code',{},key), el('button',{class:'btn sm',onclick:()=>{navigator.clipboard?.writeText(key); toast('copied');}},'Copy')), el('div',{class:'row',style:'justify-content:flex-end'}, el('button',{class:'btn primary',onclick:()=>{closeModal(); TAB='setup'; renderMain();}},'Show me how to use it')))); }

/* ---------- main views ---------- */
function renderMain(){
  const main=$('#main'); main.innerHTML='';
  const t = ME.tenants.find(x=>x.id===CUR);
  if (!t) { main.append(el('div',{class:'card'}, el('h2',{},'No tenants yet'), el('p',{class:'muted'},'Create a tenant to get an API key.'))); return; }
  const tabs = [['overview','Overview'],['keys','Keys'],['playground','Playground'],['setup','Setup'],['settings','Settings']];
  main.append(el('div',{class:'titlebar'}, el('h1',{},t.name), el('span',{class:'pill'},t.id), el('div',{class:'tabs'}, tabs.map(([k,l])=>el('button',{class:k===TAB?'active':'',onclick:()=>{TAB=k; renderMain();}},l)))));
  ({overview, keys, playground, setup, settings})[TAB](main, t);
}

/* overview */
async function overview(main, t){
  const head = el('div',{class:'row',style:'margin-bottom:.8rem'}, el('span',{class:'muted'},'Range'), ...[1,24,168].map(h=>el('button',{class:'btn sm'+(h===RANGE?' primary':''),onclick:()=>{RANGE=h; renderMain();}}, h===1?'1h':h===24?'24h':'7d')));
  const tiles = el('div',{class:'grid tiles',id:'tiles'}); const charts = el('div',{class:'grid charts',id:'charts'}); const tbl = el('div',{class:'tbl',id:'recent',style:'margin-top:.9rem'});
  main.append(head, tiles, el('div',{style:'height:.9rem'}), charts, tbl);
  let d; try { d = await api(`/tenants/${t.id}/stats?hours=${RANGE}`); api('/me').then(m=>{ ME=m; const list=$('#tenantlist'); [...list.children].forEach(b=>{ const tt=ME.tenants.find(x=>b.textContent.startsWith(x.name)); if(tt) b.querySelector('small').textContent=`${tt.requests_24h} req · 24h`; }); }).catch(()=>{}); } catch(e){ tiles.append(el('div',{class:'muted'},e.message)); return; }
  const s = d.summary; const n = s.requests||0;
  const saved = (s.list_cost_usd||0) - (s.est_cost_usd||0);
  tiles.append(
    tile('Requests', n, `${RANGE===168?'7 days':RANGE+'h'}`),
    tile('Answered', n? Math.round(s.answered_rate*100)+'%' : '—', n? `${s.queued} queued` : 'no traffic yet'),
    tile('Served without cloud', n? Math.round(s.served_without_cloud_rate*100)+'%' : '—', 'cache + on-device'),
    tile('p50 latency', n? s.p50_ms+'ms' : '—', n? `p95 ${s.p95_ms}ms` : ''),
    tile('Fallbacks', n? s.total_fallbacks : '—', n? `${s.stream_resumes||0} mid-stream resumes` : ''),
    tile('Spend', n? fmtUSD(s.est_cost_usd||0) : '—', n? `list ${fmtUSD(s.list_cost_usd||0)}${saved>0?' · free tier saved '+fmtUSD(saved):''}` : ''),
  );
  charts.append(chartBox('Requests by route', 'stacked per bucket; the ladder is the legend order', 'c-routes'),
                chartBox('Answered rate', 'share of requests answered (queued = not answered)', 'c-answered'),
                chartBox('Latency (p50)', 'milliseconds per bucket', 'c-lat'),
                chartBox('Network as the gateway saw it', 'latency line; red band = offline', 'netchart'));
  drawStacked($('#c-routes'), d.series, d.bucket_s);
  drawLine($('#c-answered'), d.series, 'answered_rate', v=>Math.round(v*100)+'%', 1);
  drawLine($('#c-lat'), d.series, 'p50_ms', v=>v+'ms');
  if (window._net) drawNetwork($('#netchart'), window._net.history);
  tbl.append(el('h3',{},'Recent requests'), recentTable(d.recent));
}
const tile = (l,n,s) => el('div',{class:'tile'}, el('div',{class:'l'},l), el('div',{class:'n'},String(n)), el('div',{class:'s'},s||''));
const chartBox = (h,sub,id) => el('div',{class:'chart'}, el('h3',{},h), el('div',{class:'sub'},sub), el('div',{id}));
function recentTable(rows){
  if (!rows.length) return el('div',{class:'muted',style:'padding:.8rem .95rem'},'Nothing yet. Send a request from the playground or your app.');
  return el('table',{}, el('thead',{}, el('tr',{}, ['time','route','model','ms','tokens','cost','lang','net','reason'].map(h=>el('th',{},h)))),
    el('tbody',{}, rows.map(r=>el('tr',{}, el('td',{class:'mono'},fmtHM(r.ts)), el('td',{},routeChip(r.route)), el('td',{class:'mono'},r.model||''), el('td',{class:'mono'},Math.round(r.total_ms)), el('td',{class:'mono'},`${r.prompt_tokens}/${r.completion_tokens}`), el('td',{class:'mono'},fmtUSD(r.est_cost_usd||0)), el('td',{class:'mono'},r.lang), el('td',{class:'mono'}, r.network? (r.network.online? `${r.network.profile} ${r.network.latency_ms}ms` : 'offline') : ''), el('td',{class:'muted',style:'max-width:280px'},r.reason)))));
}
const routeChip = r => el('span',{class:'rc'}, el('i',{style:`background:${RCOLOR(r)}`}), RLABEL[r]||r);

/* ---------- charts (inline SVG) ---------- */
const NS='http://www.w3.org/2000/svg';
const svgel = (t,a={}) => { const n=document.createElementNS(NS,t); for (const [k,v] of Object.entries(a)) n.setAttribute(k,v); return n; };
const tip = $('#tip');
function showTip(host, x, y, html){ const r=host.getBoundingClientRect(); tip.innerHTML=html; tip.style.display='block'; tip.style.left=(r.left+window.scrollX+x)+'px'; tip.style.top=(r.top+window.scrollY+y)+'px'; }
function hideTip(){ tip.style.display='none'; }
function frame(host, W, H=170, pad={l:38,r:8,t:8,b:22}){ host.innerHTML=''; W = W || Math.max(240, Math.floor(host.clientWidth || host.parentElement?.clientWidth || 600)); const s=svgel('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H}); host.append(s); return {s,W,H,pad,iw:W-pad.l-pad.r,ih:H-pad.t-pad.b}; }
function yAxis(f, max, fmt){ for (let i=0;i<=2;i++){ const v=max*i/2, y=f.pad.t+f.ih-(f.ih*i/2); f.s.append(svgel('line',{x1:f.pad.l,x2:f.W-f.pad.r,y1:y,y2:y,class:'gridline'})); const t=svgel('text',{x:f.pad.l-6,y:y+3,'text-anchor':'end',class:'axis'}); t.textContent=fmt(v); f.s.append(t);} }
function xLabels(f, series, n){ if(!n) return; const step=Math.max(1,Math.ceil(n/5)); series.forEach((b,i)=>{ if(i%step) return; const x=f.pad.l+(i+0.5)*f.iw/n; const t=svgel('text',{x,y:f.H-6,'text-anchor':'middle',class:'axis'}); t.textContent=fmtHM(b.t); f.s.append(t); }); }
function drawStacked(host, series, bucket){
  if (!series.length) { host.innerHTML='<div class="empty">no requests in this range</div>'; return; }
  const f = frame(host); const n=series.length; const max=Math.max(1,...series.map(b=>b.requests)); yAxis(f,max,v=>Math.round(v)); xLabels(f,series,n);
  const bw = f.iw/n; const w = Math.max(2, bw-2);
  series.forEach((b,i)=>{ let y0=f.pad.t+f.ih; const x=f.pad.l+i*bw+1;
    for (const r of ROUTES){ const c=b.routes[r]||0; if(!c) continue; const h=f.ih*c/max; y0-=h; const rect=svgel('rect',{x,y:y0,width:w,height:Math.max(0,h-2),rx:2,fill:RCOLOR(r)}); rect.addEventListener('mousemove',()=>showTip(host, x+w/2, y0, `${fmtT(b.t)}<br>${RLABEL[r]}: ${c} of ${b.requests}`)); rect.addEventListener('mouseleave',hideTip); f.s.append(rect);} });
  host.append(el('div',{class:'legend'}, ROUTES.filter(r=>series.some(b=>b.routes[r])).map(r=>el('span',{}, el('i',{style:`background:${RCOLOR(r)}`}), RLABEL[r]))));
}
function drawLine(host, series, key, fmt, fixedMax){
  if (!series.length) { host.innerHTML='<div class="empty">no requests in this range</div>'; return; }
  const f=frame(host); const n=series.length; const max=fixedMax||Math.max(1,...series.map(b=>b[key])); yAxis(f,max,fmt); xLabels(f,series,n);
  const pts = series.map((b,i)=>[f.pad.l+(i+0.5)*f.iw/n, f.pad.t+f.ih-(f.ih*b[key]/max)]);
  f.s.append(svgel('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '),fill:'none',stroke:'var(--s-cloud-large)','stroke-width':2,'stroke-linejoin':'round'}));
  pts.forEach((p,i)=>{ const c=svgel('circle',{cx:p[0],cy:p[1],r:n>40?2:4,fill:'var(--s-cloud-large)',stroke:'var(--panel)','stroke-width':2}); const hit=svgel('rect',{x:p[0]-f.iw/n/2,y:f.pad.t,width:f.iw/n,height:f.ih,fill:'transparent'}); hit.addEventListener('mousemove',()=>showTip(host,p[0],p[1],`${fmtT(series[i].t)}<br>${fmt(series[i][key])} · ${series[i].requests} req`)); hit.addEventListener('mouseleave',hideTip); f.s.append(hit,c); });
}
function drawNetwork(host, hist){
  if (!hist || !hist.length) { host.innerHTML='<div class="empty">sampling…</div>'; return; }
  const f=frame(host); const n=hist.length; const max=Math.max(100,...hist.map(h=>h.latency_ms)); yAxis(f,max,v=>Math.round(v)+'ms');
  const x = i => f.pad.l + i*f.iw/Math.max(1,n-1);
  let start=null; hist.forEach((h,i)=>{ if(!h.online && start===null) start=i; if((h.online||i===n-1) && start!==null){ const end = h.online? i : i+1; f.s.append(svgel('rect',{x:x(start),y:f.pad.t,width:Math.max(2,x(Math.min(end,n-1))-x(start)),height:f.ih,fill:'var(--down)',opacity:.18})); start=null; } });
  f.s.append(svgel('path',{d:hist.map((h,i)=>(i?'L':'M')+x(i)+' '+(f.pad.t+f.ih-f.ih*(h.online?h.latency_ms:0)/max)).join(' '),fill:'none',stroke:'var(--s-cloud-large)','stroke-width':2}));
  const hit=svgel('rect',{x:f.pad.l,y:f.pad.t,width:f.iw,height:f.ih,fill:'transparent'}); hit.addEventListener('mousemove',e=>{ const r=host.querySelector('svg').getBoundingClientRect(); const i=Math.round((e.clientX-r.left)/r.width*(n-1)); const h=hist[Math.max(0,Math.min(n-1,i))]; showTip(host, x(i), 20, `${fmtHM(h.t)} · ${h.profile}<br>${h.online? h.latency_ms+'ms · '+Math.round(h.packet_loss*100)+'% loss' : 'offline'}`); }); hit.addEventListener('mouseleave',hideTip); f.s.append(hit);
  [[0],[n-1]].forEach(([i])=>{ const t=svgel('text',{x:x(i),y:f.H-6,'text-anchor':i?'end':'start',class:'axis'}); t.textContent=fmtHM(hist[i].t); f.s.append(t); });
}

/* keys */
function keys(main, t){
  const box = el('div',{class:'tbl'}); main.append(el('div',{class:'row',style:'margin-bottom:.8rem'}, el('p',{class:'muted',style:'margin:0;flex:1'},'Keys authenticate your app to the gateway. They are shown once and stored hashed. All keys of a tenant share its budget and flags.'), el('button',{class:'btn primary',onclick:async()=>{ const name=prompt('Key name (e.g. prod, staging):','prod'); if(name===null) return; try{ const k=await api(`/tenants/${t.id}/keys`,{method:'POST',body:{name}}); ME=await api('/me'); renderShell(); showKeyOnce(k.key, name);}catch(e){toast(e.message);} }},'+ Create key')), box);
  if (!t.keys.length) { box.append(el('div',{class:'muted',style:'padding:.9rem'},'No keys yet.')); return; }
  box.append(el('table',{}, el('thead',{}, el('tr',{}, ['key','name','created','last used','status',''].map(h=>el('th',{},h)))), el('tbody',{}, t.keys.map(k=>el('tr',{}, el('td',{class:'mono'},k.prefix+'…'), el('td',{},k.name||''), el('td',{class:'mono'},fmtT(k.created_at)), el('td',{class:'mono'},k.last_used?fmtT(k.last_used):'never'), el('td',{},k.revoked?'revoked':'active'), el('td',{}, k.revoked?'':el('button',{class:'btn sm danger',onclick:async()=>{ if(!confirm('Revoke this key? Apps using it stop immediately.')) return; await api(`/tenants/${t.id}/keys/${k.id}`,{method:'DELETE'}); ME=await api('/me'); renderShell(); }},'Revoke')))))));
}

/* playground */
function playground(main, t){
  const msgs = el('div',{class:'msgs'}); const ta = el('textarea',{placeholder:'Message… (Enter to send, Shift+Enter for newline)'}); const send = el('button',{class:'btn primary'},'Send');
  const ctl = el('div',{class:'row',style:'margin-bottom:.6rem'}, el('span',{class:'muted'},'Network'), ...(((window._net||{}).profiles)||CFG.profiles||[]).map(p=>el('button',{class:'btn sm'+((window._net?.state?.profile)===p?' primary':''),'data-p':p,onclick:async()=>{ try{ await api('/network',{method:'POST',body:{profile:p}}); await pollNetwork(); ctl.querySelectorAll('button[data-p]').forEach(b=>b.classList.toggle('primary', b.dataset.p===p)); toast('network: '+p); }catch(e){ toast(e.message);} }},p)));
  if (!(window._net?.control ?? CFG.network_control)) ctl.append(el('span',{class:'muted'},'(profile control is admin-only on a live deployment)'));
  main.append(ctl, el('div',{class:'pg'}, msgs, el('div',{class:'composer'}, ta, send)));
  const history=[]; const add=(cls,txt)=>{ const m=el('div',{class:'m '+cls},txt); msgs.append(m); msgs.scrollTop=msgs.scrollHeight; return m; };
  async function go(){ const text=ta.value.trim(); if(!text) return; ta.value=''; add('me',text); history.push({role:'user',content:text}); const bot=add('bot',''); const chip=el('div',{class:'rc',style:'margin:-.4rem 0 0'}); msgs.append(chip); send.disabled=true;
    try{ const r = await fetch(`/console/api/tenants/${t.id}/chat`,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({messages:history,stream:true})});
      if(!r.ok){ const e=await r.json().catch(()=>({})); bot.textContent='error: '+(e.error?.message||r.status); return; }
      const rd=r.body.getReader(); const dec=new TextDecoder(); let buf='', full='', okada=null;
      while(true){ const {value,done}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2); if(!line.startsWith('data:')) continue; const d=line.slice(5).trim(); if(d==='[DONE]') continue; let ev; try{ev=JSON.parse(d);}catch{continue;} const delta=ev.choices?.[0]?.delta?.content; if(delta){ full+=delta; bot.textContent=full; msgs.scrollTop=msgs.scrollHeight; } if(ev.okada?.event==='rung'){ chip.innerHTML=''; chip.append(el('i',{style:`background:${RCOLOR(ev.okada.route)}`}), 'trying '+(RLABEL[ev.okada.route]||ev.okada.route)+'…'); } if(ev.okada && !ev.okada.event) okada=ev.okada; } }
      history.push({role:'assistant',content:full});
      if(okada){ chip.innerHTML=''; chip.append(el('i',{style:`background:${RCOLOR(okada.route)}`}), `${RLABEL[okada.route]||okada.route} · ${Math.round(okada.total_ms)}ms${okada.fallback_count?' · '+okada.fallback_count+' fallback':''}${okada.resumed?' · resumed mid-stream':''}${okada.queue_id?' · '+okada.queue_id:''}`, el('span',{class:'muted',style:'margin-left:.4rem'},okada.reason)); const fb=el('span',{style:'margin-left:.5rem'}, ...['up','down'].map(v=>el('button',{class:'btn sm',style:'padding:.1rem .4rem',title:'label this answer',onclick:async()=>{ try{ await api(`/tenants/${t.id}/feedback`,{method:'POST',body:{request_id:okada.request_id,rating:v}}); toast('thanks — label recorded'); }catch(e){toast(e.message);} }}, v==='up'?'👍':'👎'))); chip.append(fb); }
    }catch(e){ bot.textContent='gateway unreachable: '+e.message; } finally { send.disabled=false; ta.focus(); } }
  send.onclick=go; ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); go(); } }; ta.focus();
}

/* setup */
function setup(main, t){
  const base = location.origin + '/v1';
  const key = 'ok_live_…your key…';
  main.append(el('p',{class:'muted'},'Any OpenAI-compatible client works. Set the base URL to this gateway and use a tenant key. The `okada` field on every response tells you which route answered and why.'),
    el('h3',{},'curl'), el('pre',{},`curl ${base}/chat/completions \\\n  -H "Authorization: Bearer ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"auto","messages":[{"role":"user","content":"Abeg, how far?"}]}'`),
    el('h3',{},'Python (openai SDK)'), el('pre',{},`from openai import OpenAI\nclient = OpenAI(base_url="${base}", api_key="${key}")\nr = client.chat.completions.create(model="auto", stream=True,\n    messages=[{"role": "user", "content": "hello"}])\nfor chunk in r:\n    print(chunk.choices[0].delta.content or "", end="")`),
    el('h3',{},'JavaScript (openai SDK)'), el('pre',{},`import OpenAI from "openai";\nconst client = new OpenAI({ baseURL: "${base}", apiKey: "${key}" });\nconst r = await client.chat.completions.create({ model: "auto",\n  messages: [{ role: "user", content: "hello" }] });\nconsole.log(r.choices[0].message.content, r.okada);`),
    el('h3',{},'Useful headers'), el('pre',{},`x-okada-idempotency-key: <order-id>   # a retry after reconnect returns the same queued job\nx-okada-upstream-key: <provider key>   # bring your own Groq/OpenAI key for this call\nx-okada-mode: direct                   # bypass resilience (what a naive app does) — for comparisons`),
    el('h3',{},'Run the same gateway on your own box (offline rung)'), el('pre',{},`git clone https://github.com/demimadeit/okada-router && cd okada-router\nGROQ_API_KEY=... OKADA_KEYS_FILE=config/keys.yaml docker compose up\n# then open http://localhost:8080/console on that box`));
}

/* settings */
function settings(main, t){
  const f = el('form',{class:'card',style:'max-width:520px',onsubmit:async e=>{ e.preventDefault(); const fd=new FormData(e.target); const b=fd.get('budget'); try{ await api(`/tenants/${t.id}`,{method:'PATCH',body:{name:fd.get('name'), max_budget_usd:b?parseFloat(b):null, budget_duration:fd.get('duration'), no_offshore:fd.get('nooff')==='on', degraded_max_tokens:fd.get('cap')?parseInt(fd.get('cap')):null}}); ME=await api('/me'); toast('saved'); renderShell(); }catch(err){ toast(err.message);} }},
    el('label',{},'Name'), el('input',{name:'name',value:t.name}),
    el('label',{},'Budget, USD (blank = unlimited)'), el('input',{name:'budget',type:'number',step:'0.01',min:'0',value:t.max_budget_usd??''}),
    el('label',{},'Budget window'), el('select',{name:'duration'}, ['daily','monthly','total'].map(v=>el('option',{value:v,...(v===t.budget_duration?{selected:''}:{})},v))),
    el('label',{},'Response cap on degraded cloud rungs (tokens)'), el('input',{name:'cap',type:'number',min:'32',value:t.degraded_max_tokens??''}),
    el('label',{style:'display:flex;gap:.5rem;align-items:center;margin-top:1rem'}, el('input',{name:'nooff',type:'checkbox',style:'width:auto',...(t.no_offshore?{checked:''}:{})}), 'No-offshore: never call a cloud provider for this tenant'),
    el('p',{class:'muted'},`Spent this window: ${fmtUSD(t.spent_usd_window||0)}. Budgets count what you are actually billed (free-tier providers count as $0); the overview shows list prices alongside.`),
    el('div',{class:'row',style:'justify-content:flex-end;margin-top:1rem'}, el('button',{class:'btn primary'},'Save')));
  main.append(f);
}

boot();
